<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSS Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --card-border: #232d42;
      --card-border-hover: #3b82f6;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --box-bg: #1e293b;
      --input-bg: #0f172a;
      --rps-color: #10b981;
      --eg-color: #3b82f6;
      --gi-color: #8b5cf6;
      --new-border: #ef4444;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-border-hover: #2563eb;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #059669;
      --box-bg: #f1f5f9;
      --input-bg: #ffffff;
      --new-border: #dc2626;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem;
      transition: background-color 0.25s ease, color 0.25s ease;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .title-area {
      max-width: 400px;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }

    .title-area h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--text-main) 60%, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .title-area.is-reminder h1 {
      display: inline-block;
      font-weight: 900;
      background: linear-gradient(90deg, #ff0000, #ff5500, #ef4444, #b91c1c, #ff0000);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: warpGradient 2s ease infinite, marquee 10s linear infinite;
      padding-right: 50px;
    }

    @keyframes warpGradient {
      0% { background-position: 0% 50%; filter: hue-rotate(0deg); }
      50% { background-position: 100% 50%; filter: hue-rotate(-20deg); }
      100% { background-position: 0% 50%; filter: hue-rotate(0deg); }
    }

    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    select, button {
      font-family: inherit;
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 0.55rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      outline: none;
      transition: all 0.15s ease;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    button:hover {
      border-color: var(--card-border-hover);
    }

    button.btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    button.btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
    }

    .theme-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .stacked-container {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .feed-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-md);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    /* Brand Colored Card Borders when Expanded */
    .feed-card.rps:not(.is-collapsed) {
      border-color: var(--rps-color);
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.15);
    }

    .feed-card.eg:not(.is-collapsed) {
      border-color: var(--eg-color);
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.15);
    }

    .feed-card.gi:not(.is-collapsed) {
      border-color: var(--gi-color);
      box-shadow: 0 0 16px rgba(139, 92, 246, 0.15);
    }

    .feed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      padding-bottom: 0.5rem;
    }

    .feed-header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .feed-card.rps .feed-header { border-bottom: 2px solid var(--rps-color); }
    .feed-card.eg .feed-header { border-bottom: 2px solid var(--eg-color); }
    .feed-card.gi .feed-header { border-bottom: 2px solid var(--gi-color); }

    .feed-card.is-collapsed .feed-header {
      border-bottom: none;
      padding-bottom: 0;
    }

    .feed-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.8rem;
      color: #fff;
      flex-shrink: 0;
      letter-spacing: -0.03em;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }

    .brand-logo.rps { background: linear-gradient(135deg, #10b981, #059669); }
    .brand-logo.eg { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .brand-logo.gi { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }

    .brand-logo.unread-badge {
      background: #ef4444 !important;
      color: #ffffff !important;
      font-weight: 900 !important;
      font-size: 0.9rem !important;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.6) !important;
      animation: pulseRedBadge 1.8s infinite;
    }

    @keyframes pulseRedBadge {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .brand-logo.has-unread-open {
      background: linear-gradient(135deg, #ff007f, #7928ca, #00dfd8, #ff007f) !important;
      background-size: 300% 300% !important;
      animation: psychGradient 3s ease infinite !important;
      cursor: pointer !important;
      font-size: 1.1rem !important;
      font-weight: 900 !important;
    }

    @keyframes psychGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .section-chevron {
      font-size: 0.85rem;
      color: var(--text-muted);
      transition: transform 0.25s ease;
      font-weight: 800;
    }

    .feed-card.is-collapsed .section-chevron {
      transform: rotate(-90deg);
    }

    .feed-content {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
    }

    .feed-card.is-collapsed .feed-content {
      display: none;
    }

    .status-msg {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .entry-box {
      background: var(--box-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      min-width: 0;
      box-sizing: border-box;
      box-shadow: var(--shadow-sm);
    }

    .entry-box:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    }

    .entry-box.is-new {
      border: 2px solid var(--new-border) !important;
      animation: pulseBorder 2s infinite;
    }

    @keyframes pulseBorder {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .meta-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .pub-info-link {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    .entry-box.expanded .pub-info-link {
      color: var(--primary);
      text-decoration: underline;
      font-weight: 700;
    }

    .entry-box.expanded .pub-info-link:hover {
      color: var(--primary-hover);
    }

    .expand-hint {
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      background: rgba(59, 130, 246, 0.1);
      padding: 0.2rem 0.58rem;
      border-radius: 6px;
      transition: all 0.15s ease;
    }

    .expand-text {
      display: inline;
    }

    .arrow-icon {
      display: inline-block;
      transition: transform 0.2s ease;
      font-size: 0.7rem;
    }

    .entry-box:hover .arrow-icon {
      animation: subtleBounce 0.6s infinite alternate ease-in-out;
    }

    .entry-box.expanded .arrow-icon {
      transform: rotate(180deg);
      animation: none;
    }

    @keyframes subtleBounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(2px); }
    }

    .headline-preview {
      font-size: 0.925rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text-main);
      word-break: break-word;
      letter-spacing: -0.01em;
    }

    .entry-box.expanded .headline-preview {
      display: none;
    }

    .options-drawer {
      display: none;
      flex-direction: column;
      gap: 0.65rem;
      margin-top: 0.25rem;
      min-width: 0;
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .entry-box.expanded .options-drawer {
      display: flex;
    }

    .option-row {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 0;
    }

    .option-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 800;
    }

    .option-btn {
      background: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      font-size: 0.8rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: normal;
      word-break: break-word;
      line-height: 1.4;
      width: 100%;
      box-sizing: border-box;
      font-weight: 500;
    }

    .option-btn:hover {
      border-color: var(--accent);
      background: var(--card-bg);
      transform: translateX(2px);
    }
  </style>
</head>
<body>

  <header>
    <div class="title-area" id="titleContainer" onclick="resetTitleState()">
      <h1 id="appTitle">RSS Scanner</h1>
    </div>
    <div class="top-controls">
      <button class="theme-btn" onclick="toggleTheme()" id="themeToggle">☀️ Light Mode</button>
      <button class="btn-primary" onclick="scanAllFeeds(true)">Refresh Feeds</button>
    </div>
  </header>

  <div class="stacked-container">
    <!-- Rock Paper Shotgun Card -->
    <div class="feed-card rps" id="card-rps">
      <div class="feed-header" onclick="toggleSection('rps')">
        <div class="feed-header-left">
          <div id="logo-rps" class="brand-logo rps" onclick="clearUnreadForFeed('rps', event)">RPS</div>
          <h2>Rock Paper Shotgun</h2>
        </div>
        <span class="section-chevron">▼</span>
      </div>
      <div class="feed-content">
        <div id="rps-status" class="status-msg">Loading feed...</div>
        <div id="rps-list"></div>
      </div>
    </div>

    <!-- Eurogamer Card -->
    <div class="feed-card eg" id="card-eg">
      <div class="feed-header" onclick="toggleSection('eg')">
        <div class="feed-header-left">
          <div id="logo-eg" class="brand-logo eg" onclick="clearUnreadForFeed('eg', event)">EG</div>
          <h2>Eurogamer</h2>
        </div>
        <span class="section-chevron">▼</span>
      </div>
      <div class="feed-content">
        <div id="eg-status" class="status-msg">Loading feed...</div>
        <div id="eg-list"></div>
      </div>
    </div>

    <!-- GamesIndustry.biz Card -->
    <div class="feed-card gi" id="card-gi">
      <div class="feed-header" onclick="toggleSection('gi')">
        <div class="feed-header-left">
          <div id="logo-gi" class="brand-logo gi" onclick="clearUnreadForFeed('gi', event)">GI</div>
          <h2>GamesIndustry.biz</h2>
        </div>
        <span class="section-chevron">▼</span>
      </div>
      <div class="feed-content">
        <div id="gi-status" class="status-msg">Loading feed...</div>
        <div id="gi-list"></div>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_TITLE = "RSS Scanner";

    const FEEDS = {
      rps: {
        url: 'https://www.rockpapershotgun.com/feed',
        statusId: 'rps-status',
        listId: 'rps-list',
        logoId: 'logo-rps',
        cardId: 'card-rps',
        label: 'RPS',
        domain: 'rockpapershotgun.com'
      },
      eg: {
        url: 'https://www.eurogamer.net/feed',
        statusId: 'eg-status',
        listId: 'eg-list',
        logoId: 'logo-eg',
        cardId: 'card-eg',
        label: 'EG',
        domain: 'eurogamer.net'
      },
      gi: {
        url: 'https://www.gamesindustry.biz/feed',
        statusId: 'gi-status',
        listId: 'gi-list',
        logoId: 'logo-gi',
        cardId: 'card-gi',
        label: 'GI',
        domain: 'gamesindustry.biz'
      }
    };

    const knownLinks = new Set();
    const newLinkSet = new Set();
    const unreadCountByFeed = { rps: 0, eg: 0, gi: 0 };
    const initialLoadState = { rps: false, eg: false, gi: false };
    
    let newUnseenCount = 0;
    let lastTriggeredHour = -1;

    function toggleSection(key) {
      const card = document.getElementById(FEEDS[key].cardId);
      if (!card) return;

      card.classList.toggle('is-collapsed');
      updateFeedLogoState(key);
    }

    function checkHourlyReminder() {
      const now = new Date();
      if (now.getMinutes() === 2 && lastTriggeredHour !== now.getHours()) {
        lastTriggeredHour = now.getHours();
        triggerReminderTitle();
      }
    }

    function triggerReminderTitle() {
      const container = document.getElementById('titleContainer');
      const titleElem = document.getElementById('appTitle');

      container.classList.add('is-reminder');
      titleElem.textContent = "Reminder: Reposts";
      document.title = "⚠️ REMINDER: REPOSTS - RSS Scanner";
    }

    function resetTitleState() {
      const container = document.getElementById('titleContainer');
      const titleElem = document.getElementById('appTitle');

      container.classList.remove('is-reminder');
      titleElem.textContent = DEFAULT_TITLE;
      updateTabTitle();
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeButtonText(savedTheme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeButtonText(newTheme);
    }

    function updateThemeButtonText(theme) {
      const btn = document.getElementById('themeToggle');
      btn.textContent = theme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
    }

    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      scanAllFeeds(false);

      // Auto-refresh every 20 minutes
      setInterval(() => { scanAllFeeds(false); }, 1200000); 
      setInterval(checkHourlyReminder, 10000);
    });

    function scanAllFeeds(isUserManualRefresh) {
      if (isUserManualRefresh) {
        newUnseenCount = 0;
        newLinkSet.clear();
        updateTabTitle();
        clearUnreadForFeed('rps', null);
        clearUnreadForFeed('eg', null);
        clearUnreadForFeed('gi', null);
      }
      fetchSingleFeed('rps', FEEDS.rps.url);
      fetchSingleFeed('eg', FEEDS.eg.url);
      fetchSingleFeed('gi', FEEDS.gi.url);
    }

    // Direct Native XML Reader via CORS proxy pass-through (No JSON caching)
    async function fetchSingleFeed(key, feedUrl) {
      const config = FEEDS[key];
      const statusElem = document.getElementById(config.statusId);
      const listElem = document.getElementById(config.listId);

      statusElem.textContent = 'Fetching articles...';

      const proxies = [
        url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
        url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
      ];

      let xmlText = null;

      for (const getProxyUrl of proxies) {
        try {
          const res = await fetch(getProxyUrl(feedUrl));
          if (res.ok) {
            const text = await res.text();
            if (text && (text.includes('<rss') || text.includes('<channel'))) {
              xmlText = text;
              break;
            }
          }
        } catch (e) {
          // try next proxy silently
        }
      }

      if (!xmlText) {
        statusElem.textContent = 'Error: Unable to fetch live feed.';
        return;
      }

      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const itemNodes = xmlDoc.querySelectorAll("item");

        let items = [];
        itemNodes.forEach(item => {
          const title = item.querySelector("title")?.textContent?.trim() || '';
          
          let link = '';
          const linkNode = item.querySelector("link");
          if (linkNode) {
            link = linkNode.textContent?.trim() || linkNode.getAttribute("href") || '';
          }

          const pubDateStr = item.querySelector("pubDate")?.textContent || item.querySelector("dc\\:date, date")?.textContent || '';
          const authorNode = item.querySelector("dc\\:creator, creator, author");
          const author = authorNode?.textContent?.trim() || '';

          const pubDate = new Date(pubDateStr);

          if (title && link && !isNaN(pubDate)) {
            items.push({
              title: title,
              link: link,
              author: author,
              date: pubDate
            });
          }
        });

        // Always show 10 most recent
        items.sort((a, b) => b.date - a.date);
        items = items.slice(0, 10);

        let freshlyArrived = false;
        if (initialLoadState[key]) {
          items.forEach(item => {
            if (!knownLinks.has(item.link)) {
              newUnseenCount++;
              unreadCountByFeed[key]++;
              freshlyArrived = true;
              newLinkSet.add(item.link);
            }
          });
        }

        if (freshlyArrived) {
          updateFeedLogoState(key);
        }

        items.forEach(item => knownLinks.add(item.link));
        initialLoadState[key] = true;

        if (items.length === 0) {
          statusElem.textContent = `No articles found.`;
        } else {
          statusElem.textContent = `Showing 10 most recent articles.`;
          renderList(listElem, items, key);
        }

        updateTabTitle();

      } catch (err) {
        console.error(`Feed parse error for ${key}:`, err);
        statusElem.textContent = 'Error parsing XML feed.';
      }
    }

    function updateFeedLogoState(key) {
      const logo = document.getElementById(FEEDS[key].logoId);
      const card = document.getElementById(FEEDS[key].cardId);
      if (!logo || !card) return;

      const isCollapsed = card.classList.contains('is-collapsed');
      const unreadCount = unreadCountByFeed[key];

      logo.classList.remove('unread-badge', 'has-unread-open');

      if (unreadCount > 0) {
        if (isCollapsed) {
          logo.classList.add('unread-badge');
          logo.textContent = unreadCount;
          logo.title = `${unreadCount} unread post(s). Click to clear or expand.`;
        } else {
          logo.classList.add('has-unread-open');
          logo.textContent = '✓';
          logo.title = 'Click to mark section as read';
        }
      } else {
        logo.textContent = FEEDS[key].label;
        logo.removeAttribute('title');
      }
    }

    function clearUnreadForFeed(key, event) {
      if (event) event.stopPropagation();
      
      unreadCountByFeed[key] = 0;

      const container = document.getElementById(FEEDS[key].listId);
      if (container) {
        container.querySelectorAll('.entry-box.is-new').forEach(box => {
          box.classList.remove('is-new');
        });
      }
      
      newLinkSet.forEach(link => {
        if (link.includes(FEEDS[key].domain)) {
          newLinkSet.delete(link);
        }
      });

      updateFeedLogoState(key);
    }

    function updateTabTitle() {
      const container = document.getElementById('titleContainer');
      if (container && container.classList.contains('is-reminder')) return;

      if (newUnseenCount > 0) {
        document.title = `(${newUnseenCount} NEW) ${DEFAULT_TITLE}`;
      } else {
        document.title = DEFAULT_TITLE;
      }
    }

    window.addEventListener('focus', () => {
      newUnseenCount = 0;
      updateTabTitle();
    });

    function renderList(container, items, keyPrefix) {
      container.innerHTML = '';

      items.forEach((item, index) => {
        const box = document.createElement('div');
        box.className = `entry-box ${newLinkSet.has(item.link) ? 'is-new' : ''}`;
        box.onclick = (e) => toggleDrawer(box, e);

        let cleanTitle = item.title.trim();
        if (!/[.!?]$/.test(cleanTitle)) {
          cleanTitle += '.';
        }

        const textOriginal = `${cleanTitle} ${item.link}`;
        const textComments = `${cleanTitle} Link in comments for more.`;
        const textForMore = `For more: ${item.link}`;

        const formattedDate = item.date.toLocaleString(undefined, {
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });

        const authorText = item.author ? ` • By ${item.author}` : '';

        box.innerHTML = `
          <div class="meta-tag">
            <a href="${item.link}" target="_blank" class="pub-info-link" onclick="handleMetaClick(event)">
              ${formattedDate}${authorText}
            </a>
            <span class="expand-hint">
              <span class="arrow-icon">▾</span>
              <span class="expand-text">Expand</span>
            </span>
          </div>
          <div class="headline-preview">${cleanTitle}</div>
          
          <div class="options-drawer">
            <div class="option-row">
              <span class="option-label">1. Original</span>
              <button class="option-btn" onclick="copyOption('${escapeQuotes(textOriginal)}', this, event)">${textOriginal}</button>
            </div>
            <div class="option-row">
              <span class="option-label">2. Link in Comments</span>
              <button class="option-btn" onclick="copyOption('${escapeQuotes(textComments)}', this, event)">${textComments}</button>
            </div>
            <div class="option-row">
              <span class="option-label">3. For More</span>
              <button class="option-btn" onclick="copyOption('${escapeQuotes(textForMore)}', this, event)">${textForMore}</button>
            </div>
          </div>
        `;

        container.appendChild(box);
      });
    }

    function handleMetaClick(event) {
      const box = event.target.closest('.entry-box');
      if (box && box.classList.contains('expanded')) {
        event.stopPropagation();
      } else {
        event.preventDefault();
      }
    }

    function toggleDrawer(boxElement, event) {
      if (event.target.tagName.toLowerCase() === 'button' || event.target.tagName.toLowerCase() === 'a') return;
      
      const isExpanded = boxElement.classList.contains('expanded');
      
      document.querySelectorAll('.entry-box.expanded').forEach(el => {
        if (el !== boxElement) el.classList.remove('expanded');
      });

      boxElement.classList.toggle('expanded', !isExpanded);
    }

    function copyOption(text, btnElement, event) {
      event.stopPropagation();
      navigator.clipboard.writeText(text);

      const originalText = btnElement.textContent;
      btnElement.textContent = '✓ Copied to clipboard!';
      btnElement.style.borderColor = 'var(--accent)';
      btnElement.style.color = 'var(--accent)';

      setTimeout(() => {
        btnElement.textContent = originalText;
        btnElement.style.borderColor = '';
        btnElement.style.color = '';
      }, 1500);
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
